# Netlify settings: plain static site, no build step.
[build]
  publish = "."
  functions = "netlify/functions"

# Project notes and config live in the repo but shouldn't be served on the website.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
